services:
  fnactor:
    image: ghcr.io/biaobiaobiao108/fnos-actor-scraper:latest
    build: .
    container_name: fnactor
    network_mode: host
    mem_limit: 768m
    env_file:
      - .env
    environment:
      CACHE_DIR: /config
      FNOS_DB_PATH: /fnos-db/trimmedia.db
      FNOS_URL: ${FNOS_URL}
      FNOS_USERNAME: ${FNOS_USERNAME}
      FNOS_PASSWORD: ${FNOS_PASSWORD}
      FNOS_TOKEN: ${FNOS_TOKEN:-}
      FNOS_CA_FILE: ${FNOS_CA_FILE:-}
      UPSTREAM_DELAY_MS: ${UPSTREAM_DELAY_MS:-2000}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      HTTP_PROXY: ${http_proxy:-}
      HTTPS_PROXY: ${https_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,192.168.31.86,192.168.31.228,flymoo}
      NO_PROXY: ${no_proxy:-localhost,127.0.0.1,192.168.31.86,192.168.31.228,flymoo}
    volumes:
      # Read-only actor/person records from the current FnOS Media database directory.
      - type: bind
        source: /usr/local/apps/@appdata/trim.media/database
        target: /fnos-db
        read_only: true
      - type: bind
        source: /vol1/docker/fnactor-cache
        target: /config
      - type: bind
        source: ${FNOS_CA_SOURCE:-/dev/null}
        target: /fnos-ca.pem
        read_only: true
    profiles: ["manual"]
