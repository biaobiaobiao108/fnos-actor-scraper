services:
  fnactor:
    image: ghcr.io/biaobiaobiao108/fnos-actor-scraper:latest
    build: .
    container_name: fnactor
    network_mode: host
    env_file:
      - .env
    environment:
      CACHE_DIR: /config
      FNOS_DB_PATH: /fnos-db/trimmedia.db
      FNOS_URL: ${FNOS_URL}
      FNOS_USERNAME: ${FNOS_USERNAME}
      FNOS_PASSWORD: ${FNOS_PASSWORD}
      FNOS_TOKEN: ${FNOS_TOKEN:-}
      UPSTREAM_DELAY_MS: ${UPSTREAM_DELAY_MS:-2000}
    volumes:
      # Read-only actor/person records from the current FnOS Media database directory.
      - type: bind
        source: /usr/local/apps/@appdata/trim.media/database
        target: /fnos-db
        read_only: true
      - type: bind
        source: /vol1/docker/fnactor-cache
        target: /config
    profiles: ["manual"]
